<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peteirada Navideña</title>
<meta name="description" content="Peteirada Navideña · sábado 19 de diciembre de 2026">
<meta name="theme-color" content="#8e1519">
<meta name="apple-mobile-web-app-title" content="Peteirada">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:title" content="Peteirada Navideña">
<meta property="og:description" content="Sábado 19 de diciembre de 2026. Apúntate con los tuyos.">
<meta property="og:image" content="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&family=Figtree:wght@500;700&display=swap">
<style>
:root{--red:#8e1519;--gold:#f3c86b;--cream:#fff3cf}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{min-height:100%;display:grid;place-items:center;text-align:center;color:var(--cream);font-family:"Figtree",system-ui,sans-serif;
  background:radial-gradient(75% 60% at 50% 38%,#c0262a,#8e1519 60%,#5a0b0f);
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:420px}
img{width:min(46vw,190px);height:auto;border-radius:28%;box-shadow:0 18px 50px -14px rgba(0,0,0,.6),0 0 0 3px rgba(243,200,107,.5)}
h1{margin:0;font-family:"Sacramento","Brush Script MT",cursive;font-weight:400;font-size:clamp(3.4rem,15vw,5rem);line-height:1;color:#fffaf0;text-shadow:0 0 6px #ffe08a,0 0 22px #ffb43a}
p{margin:0;font-weight:500;color:#ffe7b0}
.btn{display:inline-block;padding:14px 26px;border-radius:999px;background:var(--gold);color:#3a0a0c;font-weight:700;font-size:1.05rem;text-decoration:none;box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
small{color:#f5c9b8;font-size:.82rem}
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="Botella de vino Peteirada">
  <h1>Peteirada Navideña</h1>
  <p id="cd">Sábado 19 de diciembre de 2026</p>
  <a class="btn" id="go" href="https://claude.ai/artifact/4id85rsq75dRumnkYwPeBq">Entrar a la Peteirada</a>
  <small id="hint">Abriendo…</small>
</main>
<script>
(function(){
  var t=new Date(); t.setHours(12,0,0,0); var n=Math.round((new Date("2026-12-19T12:00:00")-t)/86400000);
  document.getElementById("cd").textContent = n>1 ? "Sábado 19 de diciembre · faltan "+n+" días" : n===1 ? "¡Mañana es la Peteirada!" : n===0 ? "¡Hoy es la Peteirada!" : "Sábado 19 de diciembre de 2026";
  var url=document.getElementById("go").href;
  setTimeout(function(){ location.href=url; }, 1400);
  setTimeout(function(){ document.getElementById("hint").textContent="Si no se abre sola, toca el botón."; }, 3500);
})();
</script>
</body>
</html>
